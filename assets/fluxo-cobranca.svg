<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Fluxo conceitual de cobrança</title>
  <desc id="d">Fluxo sanitizado entre competência, cobrança, pagamento, webhook, conciliação e recibo.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Segoe UI,Arial">
    <text x="58" y="60" fill="#0f172a" font-size="28" font-weight="700">Fluxo de cobrança</text>
    <text x="58" y="88" fill="#64748b" font-size="15">Visão conceitual — nenhum identificador ou dado financeiro real é exposto</text>

    <g>
      <rect x="60" y="155" width="160" height="95" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="140" y="190" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">Competência</text>
      <text x="140" y="220" text-anchor="middle" fill="#64748b" font-size="13">mês / contrato</text>

      <rect x="275" y="155" width="160" height="95" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="355" y="190" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">Cobrança</text>
      <text x="355" y="220" text-anchor="middle" fill="#64748b" font-size="13">valor + regras</text>

      <rect x="490" y="155" width="160" height="95" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <text x="570" y="190" text-anchor="middle" fill="#1e3a8a" font-size="17" font-weight="700">Pagamento</text>
      <text x="570" y="220" text-anchor="middle" fill="#3b82f6" font-size="13">PIX / manual</text>

      <rect x="705" y="155" width="160" height="95" rx="16" fill="#ecfeff" stroke="#2dd4bf" stroke-width="2"/>
      <text x="785" y="190" text-anchor="middle" fill="#134e4a" font-size="17" font-weight="700">Conciliação</text>
      <text x="785" y="220" text-anchor="middle" fill="#0f766e" font-size="13">status validado</text>

      <rect x="920" y="155" width="160" height="95" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
      <text x="1000" y="190" text-anchor="middle" fill="#14532d" font-size="17" font-weight="700">Recibo</text>
      <text x="1000" y="220" text-anchor="middle" fill="#15803d" font-size="13">PDF / histórico</text>
    </g>

    <g stroke="#64748b" stroke-width="3" marker-end="url(#a)">
      <line x1="220" y1="202" x2="264" y2="202"/>
      <line x1="435" y1="202" x2="479" y2="202"/>
      <line x1="650" y1="202" x2="694" y2="202"/>
      <line x1="865" y1="202" x2="909" y2="202"/>
    </g>

    <rect x="365" y="300" width="470" height="68" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="600" y="328" text-anchor="middle" fill="#9a3412" font-size="14" font-weight="700">Integrações financeiras exigem validação adicional</text>
    <text x="600" y="350" text-anchor="middle" fill="#7c2d12" font-size="13">webhook assinado · idempotência · autorização · auditoria · testes de cenários de falha</text>
  </g>
