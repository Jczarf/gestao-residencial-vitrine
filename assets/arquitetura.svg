<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Arquitetura lógica do Sistema de Gestão Residencial</title>
  <desc id="d">Diagrama com frontend, API, serviços, banco, integrações e segurança.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="700" fill="#0f172a">Arquitetura lógica</text>
  <text x="60" y="88" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#64748b">Representação sanitizada — sem hosts, credenciais ou dados reais</text>

  <g font-family="Inter,Segoe UI,Arial">
    <rect x="60" y="140" width="240" height="120" rx="18" fill="url(#head)"/>
    <text x="180" y="185" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Frontend</text>
    <text x="180" y="218" text-anchor="middle" fill="#bfdbfe" font-size="16">Next.js · React · TypeScript</text>
    <text x="180" y="242" text-anchor="middle" fill="#93c5fd" font-size="14">Admin + Portal do locatário</text>

    <rect x="480" y="140" width="240" height="120" rx="18" fill="#0f2533" stroke="#14b8a6" stroke-width="2"/>
    <text x="600" y="185" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">API</text>
    <text x="600" y="218" text-anchor="middle" fill="#99f6e4" font-size="16">Node.js · Express · TypeScript</text>
    <text x="600" y="242" text-anchor="middle" fill="#5eead4" font-size="14">Auth · regras · integrações</text>

    <rect x="900" y="140" width="240" height="120" rx="18" fill="#172033" stroke="#60a5fa" stroke-width="2"/>
    <text x="1020" y="185" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Persistência</text>
    <text x="1020" y="218" text-anchor="middle" fill="#bfdbfe" font-size="16">Prisma ORM</text>
    <text x="1020" y="242" text-anchor="middle" fill="#93c5fd" font-size="14">PostgreSQL</text>

    <line x1="300" y1="200" x2="470" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="385" y="186" text-anchor="middle" fill="#64748b" font-size="13">HTTPS / JSON</text>
    <line x1="720" y1="200" x2="890" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="805" y="186" text-anchor="middle" fill="#64748b" font-size="13">Prisma Client</text>

    <rect x="350" y="340" width="220" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="460" y="378" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Financeiro</text>
    <text x="460" y="407" text-anchor="middle" fill="#475569" font-size="14">Cobranças · PIX</text>
    <text x="460" y="430" text-anchor="middle" fill="#475569" font-size="14">Recibos · conciliação</text>

    <rect x="630" y="340" width="220" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="740" y="378" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Domínio</text>
    <text x="740" y="407" text-anchor="middle" fill="#475569" font-size="14">Imóveis · contratos</text>
    <text x="740" y="430" text-anchor="middle" fill="#475569" font-size="14">locatários · competências</text>

    <rect x="910" y="340" width="220" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1020" y="378" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Governança</text>
    <text x="1020" y="407" text-anchor="middle" fill="#475569" font-size="14">Auditoria · LGPD</text>
    <text x="1020" y="430" text-anchor="middle" fill="#475569" font-size="14">logs · solicitações</text>

    <line x1="600" y1="260" x2="460" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="600" y1="260" x2="740" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="600" y1="260" x2="1020" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="60" y="515" width="1070" height="78" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="90" y="548" fill="#3730a3" font-size="17" font-weight="700">Camadas transversais</text>
    <text x="90" y="576" fill="#475569" font-size="15">Helmet · CORS restritivo · rate limiting · CSRF · autenticação/autorização · validação de entrada · logs · containers Docker</text>
  </g>
</svg>
